# publish.yml — Rust crate publishing to crates.io
#
# RESPONSIBILITY: Publishes the Rust crates to crates.io in dependency order:
#   1. sanctifier-core  (library crate — must land on crates.io first)
#   2. Wait for sanctifier-core to become visible (index propagation ~2 min)
#   3. sanctifier-cli   (depends on sanctifier-core, so order matters)
#
# TRIGGER: `push` on any tag matching `v*` (same trigger as release.yml).
#
# WHY SEPARATE FROM release.yml:
#   - Publishing to crates.io is irreversible and subject to its own rate
#     limits and propagation delays; keeping it isolated means a crates.io
#     failure does not block or re-run the binary build matrix.
#   - The binary artefacts (GitHub Release, Docker, npm, Homebrew) in
#     release.yml do not depend on crates.io being up to date, so they
#     can ship in parallel.
#   - If a crates.io publish fails it can be re-triggered here without
#     re-running the expensive cross-platform build matrix.
#
# DOES NOT: build binaries, create GitHub Releases, publish npm packages,
#            update Homebrew, or push Docker images — those are in release.yml.
#
# See also: .github/workflows/release.yml (binary release + all other registries)

name: Publish to Crates.io

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish crates on version tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish sanctifier-core
        run: cargo publish --manifest-path tooling/sanctifier-core/Cargo.toml --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for sanctifier-core to reach crates.io
        run: |
          core_version=$(cargo metadata --format-version 1 --no-deps --manifest-path tooling/sanctifier-core/Cargo.toml | python -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          for attempt in {1..12}; do
            if cargo search sanctifier-core --limit 1 | grep "sanctifier-core = \"${core_version}\""; then
              exit 0
            fi
            echo "sanctifier-core ${core_version} is not visible on crates.io yet; retrying in 10 seconds"
            sleep 10
          done
          echo "Timed out waiting for sanctifier-core ${core_version} to appear on crates.io"
          exit 1

      - name: Publish sanctifier-cli
        run: cargo publish --manifest-path tooling/sanctifier-cli/Cargo.toml --token ${{ secrets.CRATES_IO_TOKEN }}
