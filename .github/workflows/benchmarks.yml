name: Performance Benchmarks

on:
  # Run on PRs and pushes to main so regressions are caught before merge.
  pull_request:
    paths:
      - 'tooling/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  push:
    branches:
      - main
    paths:
      - 'tooling/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  # Manual trigger kept for ad-hoc runs.
  workflow_dispatch: {}
  # Also run on PRs that touch performance-sensitive paths so regressions are
  # caught before merge rather than after.
  pull_request:
    branches: ["main"]
    paths:
      - "tooling/sanctifier-core/**"
      - "tooling/sanctifier-detector/**"
      - "tooling/sanctifier-cli/**"
      - "benchmarks/**"
      - "scripts/compare-benchmarks.py"
      - ".github/workflows/benchmarks.yml"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Data/schemas JSON performance snapshot
        run: |
          python benchmarks/data_schemas_perf.py --output benchmarks/data_schemas_perf.json
          cat benchmarks/data_schemas_perf.json

      - name: Docs navigation performance snapshot
        run: |
          python benchmarks/docs_nav_perf.py --output benchmarks/docs_nav_perf.json
          cat benchmarks/docs_nav_perf.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli

      - name: Build Contracts
        run: |
          # Build only the contract packages for wasm (tooling crates are native-only).
          cargo build --target wasm32-unknown-unknown --release \
            -p multisig-wallet -p amm-pool -p my-contract -p timelock \
            -p vesting-contract -p reentrancy-guard -p runtime-guard-wrapper \
            -p kani-poc-contract -p flashloan-token -p uups-proxy \
            -p token-with-bugs -p vulnerable-contract -p deposit-withdraw \
            -p governance-contract

      - name: Run Performance Tests
        run: |
          echo "Running gas and time performance tracking..."
          # --all-features is intentionally omitted: soroban-sdk's 'testutils'
          # feature is incompatible with the wasm32 target used by contract crates.
          cargo test --locked -p sanctifier-core -p sanctifier-detector -p sanctifier-cli

      - name: Publish benchmark baseline summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data_path = Path("benchmarks/data_schemas_perf.json")
          docs_path = Path("benchmarks/docs_nav_perf.json")

          print("## Benchmark Baseline")
          print("")

          if not data_path.exists() or not docs_path.exists():
              print("- Benchmark snapshots were not available for summary generation.")
              raise SystemExit(0)

          data = json.loads(data_path.read_text(encoding="utf-8"))
          docs = json.loads(docs_path.read_text(encoding="utf-8"))

          metrics = data.get("metrics", [])
          total_bytes = sum(item.get("bytes", 0) for item in metrics)
          total_read_ms = sum(item.get("read_ms", 0.0) for item in metrics)
          total_parse_ms = sum(item.get("parse_ms", 0.0) for item in metrics)
          total_rules = sum(item.get("vulnerabilities") or 0 for item in metrics)

          kb_per_sec = 0.0
          rules_per_sec = 0.0
          if total_read_ms > 0:
              kb_per_sec = (total_bytes / 1024.0) / (total_read_ms / 1000.0)
          if total_parse_ms > 0:
              rules_per_sec = total_rules / (total_parse_ms / 1000.0)

          print(f"- Source KB/sec: {kb_per_sec:.2f}")
          print(f"- Rules/sec: {rules_per_sec:.2f}")
          print(f"- Docs index size: {docs.get('size_bytes', 0)} bytes")
          print(f"- Docs links: {docs.get('total_links', 0)} total, {docs.get('dead_links_count', 0)} dead")
          PY

      - name: Regression threshold check (fail if >20% worse than baseline)
        run: |
          python3 benchmarks/check_regression.py \
            --data   benchmarks/data_schemas_perf.json \
            --docs   benchmarks/docs_nav_perf.json \
            --baseline benchmarks/baseline.json \
            --threshold 0.20

      - name: Update baseline on main (post-merge)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 benchmarks/check_regression.py \
            --data   benchmarks/data_schemas_perf.json \
            --docs   benchmarks/docs_nav_perf.json \
            --baseline benchmarks/baseline.json \
            --update-baseline

      - name: Log Performance Metrics
        run: |
          date >> benchmarks/nightly_perf.log
          echo "Benchmark results recorded."

      # ── Regression threshold check ────────────────────────────────────────
      # Save the current snapshot as "current.json" so compare-benchmarks.py
      # can diff it against the base-branch baseline stored in the repo.
      # On the first run (no baseline.json) the script bootstraps a baseline
      # and exits 0.  On subsequent runs it fails if any benchmark's mean
      # latency regresses by more than 20 % vs the base-branch snapshot.
      - name: Prepare benchmark comparison inputs
        if: github.event_name == 'pull_request'
        run: |
          # Merge the two Python benchmark snapshots into the format expected
          # by compare-benchmarks.py: { "benchmarks": [ { "name", "mean": { "estimate" } } ] }
          python3 - <<'PY'
          import json, pathlib

          def snapshot_to_benches(path, prefix):
              try:
                  data = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except FileNotFoundError:
                  return []
              benches = []
              for item in data.get("metrics", []):
                  name = prefix + "/" + item.get("file", item.get("path", "unknown"))
                  read_ns  = item.get("read_ms",  0.0) * 1_000_000
                  parse_ns = item.get("parse_ms", 0.0) * 1_000_000
                  if read_ns:
                      benches.append({"name": name + "/read",  "mean": {"estimate": read_ns}})
                  if parse_ns:
                      benches.append({"name": name + "/parse", "mean": {"estimate": parse_ns}})
              return benches

          benches  = snapshot_to_benches("benchmarks/data_schemas_perf.json", "data_schemas")
          benches += snapshot_to_benches("benchmarks/docs_nav_perf.json",      "docs_nav")
          pathlib.Path("benchmarks/current.json").write_text(
              json.dumps({"benchmarks": benches}, indent=2), encoding="utf-8"
          )
          print(f"Wrote {len(benches)} benchmark entries to benchmarks/current.json")
          PY

      - name: Fetch base-branch benchmark baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:benchmarks/current.json \
            > benchmarks/baseline.json 2>/dev/null \
            || echo '{"benchmarks":[]}' > benchmarks/baseline.json
          echo "Baseline loaded ($(python3 -c "import json; d=json.load(open('benchmarks/baseline.json')); print(len(d['benchmarks']),'entries')"))"

      - name: Check for performance regressions (threshold 20 %)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/compare-benchmarks.py \
            --baseline benchmarks/baseline.json \
            --current  benchmarks/current.json \
            --threshold 0.20
