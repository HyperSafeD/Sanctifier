[package]
license.workspace = true
name = "reentrancy-guard-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.reentrancy-guard]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_guard_state_machine"
path = "fuzz_targets/fuzz_guard_state_machine.rs"
test = false
doc = false

[[bin]]
name = "fuzz_enter_exit_sequences"
path = "fuzz_targets/fuzz_enter_exit_sequences.rs"
test = false
doc = false

[[bin]]
name = "fuzz_concurrent_access"
path = "fuzz_targets/fuzz_concurrent_access.rs"
test = false
doc = false
