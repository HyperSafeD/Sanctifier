
[package]
name = "sanctifier-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Sanctifier - Stellar Soroban Security Suite"
homepage = "https://github.com/HyperSafeD/Sanctifier"
repository = "https://github.com/HyperSafeD/Sanctifier"
license = "MIT"
keywords = ["stellar", "soroban", "security", "cli", "analysis"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
smt = ["sanctifier-core/smt"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
sanctifier-core = { version = "0.1.0", path = "../sanctifier-core", default-features = false }
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
csv = "1.3"
notify = "8.0"

[dev-dependencies]
assert_cmd = "2.0"
mockito = "1.6"
predicates = "3.1"
tempfile = "3.8"
jsonschema = "0.18"

[lib]
name = "sanctifier_cli"
path = "src/lib.rs"

[[bin]]
name = "sanctifier"
path = "src/main.rs"
