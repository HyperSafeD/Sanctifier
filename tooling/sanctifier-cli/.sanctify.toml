ignore_paths = [
    "target",
    ".git",
    # Intentional fixture: TODO comments here exist to trigger TEST-001 in
    # minimal-vulndb.json.  Any repo-wide "no leftover TODO" policy must skip
    # this file; listing it here documents that intent for future maintainers.
    "tests/vulndb/todo_example.rs",
]
enabled_rules = [
    "auth_gaps",
    "panics",
    "arithmetic",
    "ledger_size",
]
ledger_limit = 64000
strict_mode = false

# Regex-based custom rules (optional)
[[custom_rules]]
name = "no_unsafe_block"
pattern = "unsafe\\s*\\{"

[[custom_rules]]
name = "no_mem_forget"
pattern = "std::mem::forget"
